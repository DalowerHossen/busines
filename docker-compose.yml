# docker-compose.yml
# Running the platform on one machine: the application, and the scheduler
# that wakes it up for the work nobody is waiting on a page for.
#
# The database is deliberately not in here. This platform is built on a
# managed PostgreSQL with row level security doing the tenant isolation, and
# running a throwaway database beside the application would invite somebody
# to point production at it.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kd-solution-it:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  scheduler:
    image: node:20.18-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file:
      - .env.local
    environment:
      SCHEDULER_BASE_URL: http://app:3000
    volumes:
      - ./scripts/run-scheduler.mjs:/app/run-scheduler.mjs:ro
    command: ['node', '/app/run-scheduler.mjs']
