# .github/dependabot.yml
# Automated dependency update scanning (npm packages and GitHub Actions).
# Supports the supply-chain security hardening requirements tracked under
# group Z in docs/planning/FEATURE-REGISTRY.md.

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: 'production'
      development-dependencies:
        dependency-type: 'development'
    commit-message:
      prefix: 'build'
      include: 'scope'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'ci'
      include: 'scope'

  - package-ecosystem: 'docker'
    directory: '/docker'
    schedule:
      interval: 'weekly'
      day: 'monday'
    commit-message:
      prefix: 'build'
      include: 'scope'
