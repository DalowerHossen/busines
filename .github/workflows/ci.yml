# .github/workflows/ci.yml
# Continuous integration pipeline for KD SOLUTION IT. Runs on every push and
# pull request and must stay green before any branch can be merged or
# deployed. Mirrors the local `npm run verify` gate plus the build step.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (language, placeholders, types, lint, format)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: English-only language check
        run: npm run check:language

      - name: No placeholder content check
        run: npm run check:placeholders

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production bundle
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -c 6000 build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error file=.github/workflows/ci.yml,line=58::$message"
          fi
          exit "$status"
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NODE_OPTIONS: '--max-old-space-size=2048'
          # Build-time placeholder values only. Real secrets are injected by
          # the hosting provider (Netlify, Vercel, Docker) at deploy time.
          NEXT_PUBLIC_APP_URL: https://kdsolutionit.netlify.app
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_NAME: KD SOLUTION IT
          NEXT_PUBLIC_SHORT_LINK_URL: https://kdsolutionit.netlify.app
          APP_ENV: test
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          ENCRYPTION_KEY: 01234567890123456789012345678901
          LINK_SIGNING_SECRET: 01234567890123456789012345678901
          CSRF_SECRET: 01234567890123456789012345678901
          CRON_SECRET: 01234567890123456789012345678901

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run test suite
        run: npm run test --if-present
