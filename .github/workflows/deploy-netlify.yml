# .github/workflows/deploy-netlify.yml
# Production deploy to Netlify. Runs only after CI is green on the main
# branch. Netlify's own GitHub integration can also build directly from
# netlify.toml; this workflow exists for teams that prefer Actions-driven
# deploys or need a manual approval gate before going live.

name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-netlify-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run verification suite
        run: npm run verify

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Deploy to Netlify
        uses: netlify/actions/cli@master
        with:
          args: deploy --prod --dir=.next
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
