# supabase/config.toml
# Local Supabase CLI configuration for KD SOLUTION IT. This file only
# controls the local development stack (`supabase start`); production uses
# a hosted or self-hosted Supabase project configured purely through
# environment variables (see .env.example and docs/ENVIRONMENT-VARIABLES.md).
# Reference: https://supabase.com/docs/guides/local-development/cli/config

project_id = "kd-solution-it"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
# Migrations live in supabase/migrations, added starting with Phase 5.
enabled = true
schema_paths = []

[db.seed]
# Seed data (plans, super admin, CMS content, demo tenant) is added in
# Phase 19. The file exists now so `supabase db reset` always has a target.
enabled = true
sql_paths = ["./seed.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
# Emails sent during local development are captured here instead of being
# delivered, so support@kdsolutionit.com templates can be previewed safely.
enabled = true
port = 54324

[storage]
enabled = true
# Supabase Storage itself is not used for application files in this project
# (Google Drive is the default adapter, see docs/planning/ARCHITECTURE-DECISIONS.md
# section 7). This section stays enabled only so local Auth/Storage health
# checks pass; no buckets are declared here.
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

# These endpoints are invoked by Supabase Cron with CRON_SECRET in the
# x-cron-secret header. They do their own constant-time authorization and
# must not require a browser JWT.
[functions.scheduled-maintenance]
verify_jwt = false

[functions.recurring-billing]
verify_jwt = false

[functions.data-retention]
verify_jwt = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 10
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 30
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.captcha]
# Cloudflare Turnstile protects signup and login in production. See
# TURNSTILE_SITE_KEY / TURNSTILE_SECRET_KEY in .env.example.
enabled = false
provider = "turnstile"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your KD SOLUTION IT verification code is {{ .Code }}"
max_frequency = "5s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.external.google]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"

[auth.external.github]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET)"

[edge_runtime]
# Scheduled Edge Functions (payout processor, hold-period release, dunning
# reminders, backup verification and similar) are added starting in Phase 19.
enabled = true
policy = "per_worker"
inspector_port = 8083
deno_version = 2

[analytics]
enabled = false
