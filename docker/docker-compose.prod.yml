# docker/docker-compose.prod.yml
# Production stack for a self-hosted VPS deployment: the compiled Next.js
# app behind Nginx terminating TLS. Secrets are supplied via the `.env`
# file referenced below, which must never be committed (see .gitignore).
#
# Usage (from repository root):
#   docker compose -f docker/docker-compose.prod.yml --env-file .env up -d --build

name: kd-solution-it-prod

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: kd-solution-it-app
    env_file:
      - ../.env
    expose:
      - '3000'
    restart: unless-stopped
    networks:
      - kd-solution-it-net
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

  nginx:
    image: nginx:1.27-alpine
    container_name: kd-solution-it-nginx
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot-webroot:/var/www/certbot:ro
    restart: unless-stopped
    networks:
      - kd-solution-it-net
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

  certbot:
    image: certbot/certbot:latest
    container_name: kd-solution-it-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w
      /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

networks:
  kd-solution-it-net:
    driver: bridge

volumes:
  certbot-webroot:
