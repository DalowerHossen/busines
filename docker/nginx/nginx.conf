# docker/nginx/nginx.conf
# Development reverse proxy. Plain HTTP on port 80 inside the container,
# published as http://localhost:8080 by docker-compose.yml. No TLS here -
# see nginx.prod.conf for the production configuration with certificates.

server {
    listen 80;
    server_name localhost;

    client_max_body_size 10m;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
