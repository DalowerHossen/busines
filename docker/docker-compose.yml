# docker/docker-compose.yml
# Local development stack: the Next.js app with hot reload behind an Nginx
# reverse proxy. Application data (text/relational) lives in a cloud
# Supabase project per .env; uploaded files go to Google Drive per
# docs/planning/ARCHITECTURE-DECISIONS.md section 7. This compose file does
# not run a local database - point SUPABASE_DB_URL / NEXT_PUBLIC_SUPABASE_URL
# at a Supabase project (cloud or self-hosted via the official
# https://github.com/supabase/supabase docker stack run separately).
#
# Usage (from repository root):
#   docker compose -f docker/docker-compose.yml --env-file .env up --build

name: kd-solution-it-dev

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: kd-solution-it-app-dev
    ports:
      - '3000:3000'
    env_file:
      - ../.env
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    networks:
      - kd-solution-it-net

  nginx:
    image: nginx:1.27-alpine
    container_name: kd-solution-it-nginx-dev
    depends_on:
      - app
    ports:
      - '8080:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - kd-solution-it-net

networks:
  kd-solution-it-net:
    driver: bridge
